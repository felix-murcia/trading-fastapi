name: trading

services:
  fastapi:
    build: ./fastapi
    container_name: trading-fastapi
    volumes:
      - ./fastapi/ml:/app/ml
      - ./src:/app/src
      # T-31.9 (2026-10-20): el REGISTRO DIARIO INMUTABLE vive en el HOST
      # para que sea visible y versionable en git (append-only: una línea
      # por vez; cualquier retoque posterior deja rastro en el historial).
      - ./fastapi/ops:/app/ops
      - ./mql5:/mql5:ro
      - ./resultadosBT:/resultadosBT:ro

    restart: unless-stopped
    networks:
      - trading-net
    ports:
      - "0.0.0.0:8090:8000"
    env_file:
      - .env
      - .config/ai-keys.env
    environment:
      - DATABASE_URL=postgresql://trading:${POSTGRES_PASSWORD}@postgres:5432/trading
      - INTERNAL_TOKEN=${INTERNAL_TOKEN}
      - HMAC_SECRET=${HMAC_SECRET}
      - MT5_HTTP_URL=${MT5_HTTP_URL}
      - CSV_HISTORY_DIR=/resultadosBT
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    # P2-H15 (2026-10-09): rotación de logs — sin esto el json-file crece sin
    # límite y el volcado `docker logs` queda truncado/incompleto (H14/H15 de
    # la auditoría: el blackout de 62h se detectó leyendo la BD, no por logs).
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  postgres:
    image: postgres:16-alpine
    container_name: trading-postgres
    restart: unless-stopped
    networks:
      - trading-net
    ports:
      - "5435:5432"
    environment:
      - POSTGRES_USER=trading
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=trading
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./fastapi/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading -d trading"]
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  trading-net:
    driver: bridge

volumes:
  postgres_data:
